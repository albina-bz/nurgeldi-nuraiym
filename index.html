<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Нургелди & Нурайым</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Manrope:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--beige:#fdf8f2;--sage:#8a9a8c;--gold:#c8a882;--dark:#2b2b2b;--blush:#f3e9e1}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Manrope',sans-serif;background:var(--beige);color:var(--dark)}
h1,h2{font-family:'Cormorant Garamond',serif}
.hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 20px;position:relative}
.hero::before{content:'';position:absolute;top:20px;left:20px;right:20px;bottom:20px;border:1px solid var(--gold);opacity:.4}
.top-label{letter-spacing:6px;font-size:12px;text-transform:uppercase;color:var(--sage);margin-bottom:30px}
.names{font-size:clamp(48px,10vw,88px);line-height:.9}
.amp{font-size:.5em;color:var(--gold);font-style:italic;margin:8px 0;display:block}
.date-box{margin-top:40px;border-top:1px solid var(--gold);border-bottom:1px solid var(--gold);padding:20px 60px}
.countdown{display:flex;gap:16px;justify-content:center;margin:50px 0;flex-wrap:wrap}
.cd-item{background:#fff;border-radius:24px;padding:20px 18px;min-width:90px;box-shadow:0 10px 30px rgba(0,0,0,.04);border:1px solid #f0e6db}
.cd-num{font-family:'Cormorant Garamond',serif;font-size:36px}
.cd-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--sage);margin-top:8px}
.invitation{max-width:600px;margin:0 auto;padding:80px 20px;text-align:center}
.location{background:#fff;margin:60px 20px;border-radius:32px;padding:50px 30px;text-align:center;max-width:800px;margin-left:auto;margin-right:auto}
.btn{display:inline-block;margin-top:20px;padding:14px 36px;border-radius:100px;background:var(--dark);color:#fff;text-decoration:none;font-size:14px}
.rsvp{background:var(--blush);padding:80px 20px}
.rsvp-form{max-width:500px;margin:40px auto 0;background:#fff;padding:40px;border-radius:32px}
input,select,textarea{width:100%;padding:16px 20px;border:1px solid #e8ddd0;border-radius:14px;font-size:15px;margin-bottom:16px;background:#fdfaf7}
.submit{width:100%;padding:18px;background:var(--sage);color:#fff;border:none;border-radius:14px;font-size:15px;cursor:pointer}
footer{text-align:center;padding:40px;color:var(--sage);font-size:13px;letter-spacing:2px}
</style>
</head>
<body>
<section class="hero">
<div class="top-label">Тойго чакыруу</div>
<h1 class="names"><span>Нургелди</span><span class="amp">&</span><span>Нурайым</span></h1>
<div class="date-box"><p>04 ДЕКАБРЬ 2026 • 17:00</p></div>
<p style="margin-top:30px">Ресторан "Кайлас"</p>
</section>
<section class="invitation">
<p style="font-size:20px">Урматтуу коноктор!</p>
<p style="font-weight:500;margin-top:12px;font-size:20px;line-height:1.6">Сиздерди биздин тоюбузда<br>кадырлуу конок болуп кетүүңүздөргө чакырабыз!</p>
<p style="margin-top:20px;color:var(--sage);line-height:1.6">Бул күн биз үчүн эң бактылуу күндөрдүн бири. Кубанычыбызды чогуу бөлүшүп берсеңиздер биз абдан кубанычта болобуз.</p>
